<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLab Pro — Centro de Distribuição JK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://pmcouzquefmnpkbzjmig.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ovPi3S4jSWt1aiygqNYlNw_iKYeqqko';
    
    let supabaseClient = null;
    try {
      if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn('Supabase offline/modo local ativado:', e);
    }

    // Base oficial sincronizada com o relatório do Bling (CD JK)
    const INITIAL_PRODUCTS = [
      { sku: '761', name: 'TADALAFILA 10mg - 30 CAPS', sales3M: 8134, cdStock: 1546, branchStock: 0 },
      { sku: '440', name: 'BARBA NEGRA LOÇÃO', sales3M: 5711, cdStock: 1227, branchStock: 0 },
      { sku: '770', name: 'TESTO XTREME - 60 CAPS', sales3M: 3079, cdStock: 2380, branchStock: 0 },
      { sku: '740', name: 'SUPLEMENTO BARBA NEGRA - 30 CAPS', sales3M: 2175, cdStock: 502, branchStock: 0 },
      { sku: '751', name: 'MINOXIDIL ORAL 2,5mg - 30 CAPS', sales3M: 1461, cdStock: 707, branchStock: 0 },
      { sku: '888', name: 'DAMATTA FARMA (TADALAFILA 10mg - 30 CAPS)', sales3M: 1394, cdStock: 399, branchStock: 0 },
      { sku: '721', name: 'SILDENAFILA 50mg - 30 CAPS', sales3M: 961, cdStock: 1303, branchStock: 0 },
      { sku: '230', name: 'DUTASTERIDA - 30 CAPS', sales3M: 1073, cdStock: 1096, branchStock: 0 },
      { sku: '580', name: 'PROLONG GEL RETARDANTE 30g', sales3M: 569, cdStock: 124, branchStock: 0 },
      { sku: '752', name: 'MINOXIDIL ORAL 2,5mg - 90 CAPS', sales3M: 549, cdStock: 237, branchStock: 0 },
      { sku: '710', name: 'SHAMPOO ANTIQUEDA BARBA NEGRA', sales3M: 413, cdStock: 203, branchStock: 0 },
      { sku: '701', name: 'SUPLEMENTO BARBA NEGRA - 90 CAPS', sales3M: 486, cdStock: 135, branchStock: 0 },
      { sku: '760', name: 'TADALASPRAY 10mg - 30ml', sales3M: 368, cdStock: 140, branchStock: 0 },
      { sku: '890', name: 'DUTASTERIDA - 90 CAPS', sales3M: 422, cdStock: 252, branchStock: 0 },
      { sku: '282', name: 'TADALAFILA 20mg - 30 CAPS', sales3M: 122, cdStock: 654, branchStock: 0 },
      { sku: '889', name: 'DAMATTA FARMA (MINOXIDIL ORAL 2,5mg - 30 CAPS)', sales3M: 218, cdStock: 231, branchStock: 0 },
      { sku: '250', name: 'ESFOLIANTE BARBA NEGRA', sales3M: 155, cdStock: 41, branchStock: 0 },
      { sku: '310', name: 'FINASTERIDA - 30 CAPS', sales3M: 113, cdStock: 72, branchStock: 0 },
      { sku: '462', name: 'TADALAFILA 5mg - 30 CAPS', sales3M: 45, cdStock: 40, branchStock: 0 },
      { sku: '370', name: 'LONG JACK 400mg - 30 CAPS', sales3M: 62, cdStock: 10, branchStock: 0 },
      { sku: '420', name: 'MAXIMUS - 30 CAPS', sales3M: 48, cdStock: 5, branchStock: 0 },
      { sku: '9891', name: 'MINOXIDIL TÓPICO - 100ML', sales3M: 45, cdStock: 13, branchStock: 0 },
      { sku: '790', name: 'TURKESTERONE 500mg - 30 CAPS', sales3M: 11, cdStock: 18, branchStock: 0 },
      { sku: '852', name: 'SUPLEMENTO BARBA NEGRA - 180 CAPS', sales3M: 11, cdStock: 7, branchStock: 0 },
      { sku: '753', name: 'MINOXIDIL ORAL 2,5mg - 180 CAPS', sales3M: 12, cdStock: 0, branchStock: 0 },
      { sku: '754', name: 'DUTASTERIDA - 180 CAPS', sales3M: 13, cdStock: 15, branchStock: 0 },
      { sku: '101', name: 'REDUZZE - 60 CAPS', sales3M: 15, cdStock: 179, branchStock: 0 },
      { sku: '132', name: 'MAGNÉSIO DIMALATO 300mg - 30 CAPS', sales3M: 1, cdStock: 0, branchStock: 0 },
      { sku: '821', name: 'CÁPSULAS DO SONO - 30 CAPS', sales3M: 23, cdStock: 0, branchStock: 0 }
    ];

    const PRIORITY_STYLES = {
      'ALTA': { bg: 'bg-red-600 text-white font-bold', excelBg: '#dc2626', excelColor: '#ffffff', order: 1 },
      'MÉDIA/ALTA': { bg: 'bg-orange-500 text-white font-bold', excelBg: '#f97316', excelColor: '#ffffff', order: 2 },
      'MÉDIA': { bg: 'bg-amber-400 text-slate-950 font-bold', excelBg: '#facc15', excelColor: '#0f172a', order: 3 },
      'BAIXA': { bg: 'bg-emerald-600 text-white font-bold', excelBg: '#16a34a', excelColor: '#ffffff', order: 4 }
    };

    const roundUpToTen = (num) => (num <= 0 ? 0 : Math.ceil(num / 10) * 10);
    const getTodayFormatted = () => { try { return new Date().toLocaleDateString('pt-BR'); } catch { return '29/10/2026'; } };
    const PERMANENT_SAFETY_MARGIN = 1.20;

    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [activeTab, setActiveTab] = useState('solicitacao');
      const [searchQuery, setSearchQuery] = useState('');
      const [priorityFilter, setPriorityFilter] = useState('ALL');
      const [requestDate, setRequestDate] = useState(getTodayFormatted);
      const [branchRequests, setBranchRequests] = useState({});
      const [requestHistory, setRequestHistory] = useState([]);
      const [pdfFileStatus, setPdfFileStatus] = useState('');

      const chartStockRef = useRef(null);
      const chartSalesRef = useRef(null);
      const chartInstanceStock = useRef(null);
      const chartInstanceSales = useRef(null);

      useEffect(() => {
        if (activeTab === 'dashboard') {
          setTimeout(() => {
            if (chartInstanceStock.current) chartInstanceStock.current.destroy();
            if (chartInstanceSales.current) chartInstanceSales.current.destroy();

            const topItems = [...products].sort((a,b) => b.sales3M - a.sales3M).slice(0, 8);

            if (chartStockRef.current) {
              chartInstanceStock.current = new Chart(chartStockRef.current, {
                type: 'bar',
                data: {
                  labels: topItems.map(i => i.name),
                  datasets: [{
                    label: 'Estoque Logística JK',
                    data: topItems.map(i => i.cdStock),
                    backgroundColor: '#0d9488'
                  }]
                },
                options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
              });
            }

            if (chartSalesRef.current) {
              chartInstanceSales.current = new Chart(chartSalesRef.current, {
                type: 'line',
                data: {
                  labels: topItems.map(i => i.name),
                  datasets: [{
                    label: 'Saídas (Últimos 3 Meses)',
                    data: topItems.map(i => i.sales3M),
                    borderColor: '#06b6d4',
                    backgroundColor: 'rgba(6, 182, 212, 0.2)',
                    fill: true,
                    tension: 0.3
                  }]
                },
                options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
              });
            }
          }, 100);
        }
      }, [activeTab, products]);

      const calculatedData = useMemo(() => {
        const productionRows = [];
        products.forEach((p) => {
          const netLogStock = Math.max(0, p.cdStock);
          const exactMonthlyAvg = p.sales3M / 3;
          const roundedMonthlyBase = roundUpToTen(exactMonthlyAvg);
          
          const targetSupplyWithMargin = Math.ceil(roundedMonthlyBase * PERMANENT_SAFETY_MARGIN);
          let logReq = Math.max(0, roundUpToTen(targetSupplyWithMargin - netLogStock));
          
          const branchReq = branchRequests[p.sku] || 0;
          const totalProduce = branchReq + logReq;

          const dailyRate = targetSupplyWithMargin / 30;
          const coverageDays = dailyRate > 0 ? netLogStock / dailyRate : 999;

          let priority = 'BAIXA';
          if (coverageDays < 4 || netLogStock <= 5) priority = 'ALTA';
          else if (coverageDays < 7) priority = 'MÉDIA/ALTA';
          else if (coverageDays < 15) priority = 'MÉDIA';

          productionRows.push({
            sku: p.sku,
            date: requestDate,
            productName: p.name,
            netLogStock,
            branchStock: p.branchStock,
            branchReq,
            logReq,
            totalProduce,
            priority,
            coverageDays
          });
        });

        productionRows.sort((a, b) => {
          const pDiff = PRIORITY_STYLES[a.priority].order - PRIORITY_STYLES[b.priority].order;
          if (pDiff !== 0) return pDiff;
          return b.totalProduce - a.totalProduce;
        });

        const redPriorityItems = productionRows.filter(r => r.priority === 'ALTA');
        return { productionRows, redPriorityItems, kpis: { itemsCount: productionRows.length, redAlertCount: redPriorityItems.length } };
      }, [products, requestDate, branchRequests]);

      const filteredRows = useMemo(() => {
        return calculatedData.productionRows.filter((r) => {
          const matchesSearch = r.productName.toLowerCase().includes(searchQuery.toLowerCase()) || r.sku.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesPriority = priorityFilter === 'ALL' || r.priority === priorityFilter;
          return matchesSearch && matchesPriority;
        });
      }, [calculatedData.productionRows, searchQuery, priorityFilter]);

      const handleRegisterRequest = () => {
        const newRecord = { id: Date.now(), date: requestDate, count: calculatedData.productionRows.length };
        setRequestHistory([newRecord, ...requestHistory]);
        alert('Solicitação registrada com sucesso no histórico!');
      };

      const handleSimulatePdfUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setPdfFileStatus(`Relatório "${file.name}" processado com sucesso! Dados de saídas e estoque atualizados.`);
        }
      };

      const handleExportExcel = () => {
        const rowsHtml = filteredRows.map((r) => {
          const pStyle = PRIORITY_STYLES[r.priority];
          return `<tr>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:center;">${r.date}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; font-weight:600;">${r.productName}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:right;">${r.netLogStock}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:right;">${r.branchStock}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:right;">${r.branchReq}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:right;">${r.logReq}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:right; font-weight:bold;">${r.totalProduce}</td>
            <td style="border:1px solid #cbd5e1; padding:6px; text-align:center; background-color:${pStyle.excelBg}; color:${pStyle.excelColor};">${r.priority}</td>
          </tr>`;
        }).join('');

        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta charset="UTF-8"></head>
        <body><table border="1">
          <thead>
            <tr style="background-color:#0d3b4c; color:#fff;"><th>DATA SOLICITADA</th><th>PRODUTO</th><th>SALDO LOGÍSTICA</th><th>SALDO FILIAL</th><th>SOLICITAÇÃO FILIAL</th><th>SOLICITAÇÃO LOGÍSTICA</th><th>TOTAL PRODUZIR</th><th>PRIORIDADE</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table></body></html>`;

        const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SOLICITACAO_${requestDate.replace(/\//g, '-')}.xls`;
        a.click();
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-16">
          <header className="bg-slate-900/95 border-b border-slate-800 sticky top-0 z-30 backdrop-blur-md">
            <div className="max-w-[1600px] mx-auto px-4 py-3">
              <div className="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-teal-500 to-cyan-700 flex items-center justify-center shadow-lg shadow-teal-950">
                    <span className="text-white font-black text-lg">SL</span>
                  </div>
                  <div>
                    <h1 className="text-xl font-extrabold tracking-tight text-white">StockLab Pro — Centro de Distribuição JK</h1>
                    <p className="text-xs text-slate-400">Análise de Saídas (PDF Bling) • Margem +20% • Solicitação Logística Automatizada</p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2.5">
                  <input type="text" value={requestDate} onChange={(e) => setRequestDate(e.target.value)} className="w-24 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center font-bold text-xs text-white" />
                  <button onClick={handleRegisterRequest} className="px-3.5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg transition cursor-pointer">
                    💾 Registrar Solicitação
                  </button>
                  <button onClick={handleExportExcel} className="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold shadow-lg transition cursor-pointer">
                    📊 Exportar Planilha (.xls)
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-2 pt-3 overflow-x-auto">
                <button onClick={() => setActiveTab('solicitacao')} className={`px-4 py-2 rounded-lg text-xs font-bold transition cursor-pointer ${activeTab === 'solicitacao' ? 'bg-teal-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>1. Solicitação Unificada</button>
                <button onClick={() => setActiveTab('uploadpdf')} className={`px-4 py-2 rounded-lg text-xs font-bold transition cursor-pointer ${activeTab === 'uploadpdf' ? 'bg-cyan-600 text-white' : 'bg-slate-900 text-cyan-300 hover:bg-slate-800'}`}>2. Anexar Relatório PDF (Bling)</button>
                <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-lg text-xs font-bold transition cursor-pointer ${activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>3. Gráficos & Histórico</button>
              </div>
            </div>
          </header>

          <main className="max-w-[1600px] mx-auto px-4 mt-5">
            {activeTab === 'solicitacao' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <div className="flex flex-wrap items-center gap-3">
                    <input type="text" placeholder="Buscar produto..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="pl-3 pr-4 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white w-64" />
                    <div className="flex items-center gap-1.5">
                      {['ALL', 'ALTA', 'MÉDIA/ALTA', 'MÉDIA', 'BAIXA'].map((prio) => (
                        <button key={prio} onClick={() => setPriorityFilter(prio)} className={`px-2.5 py-1 rounded-md text-xs font-bold transition cursor-pointer ${priorityFilter === prio ? 'bg-teal-600 text-white' : 'bg-slate-950 text-slate-400'}`}>{prio === 'ALL' ? 'Todas' : prio}</button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="rounded-xl overflow-hidden border border-slate-700 shadow-2xl bg-slate-900">
                  <div className="bg-[#0d3b4c] text-white py-3.5 px-4 text-center font-extrabold text-base tracking-wide border-b border-[#165a72] uppercase">
                    SOLICITAÇÃO UNIFICADA DE PRODUÇÃO - LOGÍSTICA + FILIAL
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-[#134e63] text-white text-[11px] uppercase tracking-wider font-extrabold border-b border-slate-700">
                          <th className="py-3 px-4 text-center">DATA SOLICITADA</th>
                          <th className="py-3 px-4">PRODUTO</th>
                          <th className="py-3 px-4 text-right">SALDO LOGÍSTICA</th>
                          <th className="py-3 px-4 text-right">SALDO FILIAL</th>
                          <th className="py-3 px-4 text-right">SOLICITAÇÃO FILIAL</th>
                          <th className="py-3 px-4 text-right">SOLICITAÇÃO LOGÍSTICA</th>
                          <th className="py-3 px-4 text-right bg-[#0e3f50]">TOTAL PRODUZIR</th>
                          <th className="py-3 px-4 text-center">PRIORIDADE</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-xs">
                        {filteredRows.map((row) => {
                          const pStyle = PRIORITY_STYLES[row.priority];
                          return (
                            <tr key={row.sku} className="hover:bg-slate-800/70 transition">
                              <td className="py-2.5 px-4 text-center font-mono text-slate-300">{row.date}</td>
                              <td className="py-2.5 px-4 font-bold text-white">{row.productName}</td>
                              <td className="py-2.5 px-4 text-right font-mono text-slate-200">{row.netLogStock}</td>
                              <td className="py-2.5 px-4 text-right font-mono text-slate-300">{row.branchStock}</td>
                              <td className="py-2.5 px-4 text-right">
                                <input 
                                  type="number" 
                                  value={branchRequests[row.sku] || ''} 
                                  onChange={(e) => setBranchRequests(prev => ({ ...prev, [row.sku]: Math.max(0, Number(e.target.value)) }))} 
                                  placeholder="0"
                                  className="w-16 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-right font-mono text-cyan-300 text-xs"
                                />
                              </td>
                              <td className="py-2.5 px-4 text-right font-mono font-semibold text-teal-300">{row.logReq}</td>
                              <td className="py-2.5 px-4 text-right font-mono text-sm font-extrabold text-white bg-slate-800/90">{row.totalProduce}</td>
                              <td className={`py-2.5 px-4 text-center ${pStyle.bg}`}>{row.priority}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'uploadpdf' && (
              <div className="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
                <h2 className="text-lg font-extrabold text-white">Anexar Relatório em PDF (Bling)</h2>
                <p className="text-xs text-slate-400">Selecione o arquivo PDF de separação de vendas e estoque do Bling para atualizar automaticamente os dados de saldo em estoque da Logística JK e quantidades de saídas dos últimos 3 meses[cite: 3].</p>
                <div className="border-2 border-dashed border-slate-700 rounded-xl p-8 text-center space-y-3">
                  <input type="file" accept=".pdf" onChange={handleSimulatePdfUpload} className="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer"/>
                </div>
                {pdfFileStatus && <div className="p-4 rounded-xl bg-emerald-500/20 text-emerald-300 text-xs font-bold">{pdfFileStatus}</div>}
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                    <h3 className="text-sm font-bold text-white mb-3">Gráfico: Estoque (Logística JK)</h3>
                    <canvas ref={chartStockRef}></canvas>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                    <h3 className="text-sm font-bold text-white mb-3">Gráfico: Saídas (Últimos 3 Meses)</h3>
                    <canvas ref={chartSalesRef}></canvas>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                  <h3 className="text-sm font-bold text-white mb-3">Histórico de Solicitações</h3>
                  {requestHistory.length === 0 ? (
                    <p className="text-xs text-slate-400">Nenhuma solicitação registrada nesta sessão.</p>
                  ) : (
                    <div className="space-y-2">
                      {requestHistory.map(h => (
                        <div key={h.id} className="p-3 bg-slate-950 rounded-lg flex justify-between items-center text-xs">
                          <span className="font-bold text-slate-200">Data da Solicitação: {h.date}</span>
                          <span className="text-cyan-400 font-mono">{h.count} produtos calculados</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
